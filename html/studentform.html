<body>

            <tr>

<td><label for="name">student name</label></td>

<input type="text" placeholder="last name" id="name"></td>

            </tr>
            <tr>
<td><label for="">programming language</label></td>
<td><input type="checkbox"name="prog" value="java">

</td>
            </tr>

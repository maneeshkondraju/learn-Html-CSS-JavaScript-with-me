//strong number

let num = 145;
let temp = num;
let sum = 0
while (temp > 0){
    let lastDigit = temp % 10
    let fact = 1
    for ( let i =1 ; i <= lastDigit ; i++){
        fact *= i
    }
    sum += fact
    temp = parseInt(temp /10)
}
 if (sum == num)console.log(`${num} is a strong number`)
 else console.log(`${num} is not a strong number`)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = 1;
        let prime = true;
        if (num <= 1){
            prime = false

        } else{
        for (let i = 2; i <= parseInt(num / 2); i++){
            if (num % i == 0){
                prime = false
                break;
            }
        }
    }
        if (prime)console.log(`${num} is a prime number`)
        else console.log(`${num} is not a prime number`)
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //electricity bill

        let units =+prompt("enter the number:")
        if (units>0 && units<=50){
            console.log("free")
        }else if(units>50 && units<=100){
            console.log((units-50)*2)
        }
        else if(units>100 && units<=200){
            console.log((50)*2 +(units-100)*3)
        }
         else if(units>200 && units<=300){
            console.log((50)*2 + (100)*3+(units-200)*5)
        }
         else if(units>300){
            console.log((50)*2 + (100)*3+ (100)*5 +(units-300)*7)
        }
        else{
            console.log("invalid")
        }
    
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Todo List</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <style>
        body {
            background: linear-gradient(135deg, #e0f3e0, #fce7f3, #ede9fe);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        nav {
            background: linear-gradient(90deg, #7c3aed, #ec4899);
            color: white;
            padding: 18px;
            box-shadow: 0 4px 12px #0002;
        }

        nav h2 {
            font-weight: bold;
            margin: 0;
        }

        #total {
            color: #fff7ed;
            font-weight: bold;
            margin-top: 8px;
        }

        /* Input section */
        .form-control {
            border: 2px solid #a78bfa;
            border-radius: 8px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #ec4899;
            box-shadow: 0 0 5px #ec4899;
        }

        #btn {
            background: #06b6d4;
            border: none;
            font-weight: bold;
        }

        #btn:hover {
            background: #0891b2;
        }

        /* Filter */
        #select-option {
            background: #fef3c7;
            color: #92400e;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 10px;
            margin-top: 20px;
        }

        /* Task cards */
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px #0002;
            transition: 0.3s;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 20px #0003;
        }

        .card-body {
            background: linear-gradient(135deg, #ffffff, #f3e8ff);
            padding: 22px;
        }

        .task-title {
            font-size: 19px;
            font-weight: bold;
            color: #4c1d95;
            margin-left: 8px;
        }

        .status-completed {
            color: #15803d;
            background: #dcfce7;
            padding: 6px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 12px;
        }

        .status-pending {
            color: #c2410c;
            background: #ffedd5;
            padding: 6px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 12px;
        }

        .date-text {
            color: #64748b;
            font-size: 13px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 8px 16px;
        }

        .delete-btn:hover {
            background: #b91c1c;
            color: white;
        }

        .empty-message {
            color: #7c3aed;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .col-4 {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2> My Todo List</h2>
        <div id="total"></div>
    </nav>

    <div class="container mt-5">

        <!-- Add Task -->
        <div class="row">
            <div class="col-md-6 col-12 m-auto">
                <form id="form-ele">
                    <div class="input-group">
                        <input
                            type="text"
                            class="form-control"
                            id="input-ele"
                            placeholder="Enter your task..."
                        >

                        <input
                            type="submit"
                            class="btn btn-primary"
                            id="btn"
                            value="Add Task"
                        >
                    </div>
                </form>
            </div>
        </div>

        <!-- Filter -->
        <div class="text-center">
            <select id="select-option" onchange="handleSelect()">
                <option value="All">All Tasks</option>
                <option value="Completed">Completed</option>
                <option value="Not Completed">Not Completed</option>
            </select>
        </div>

        <!-- Display Tasks -->
        <div class="row mt-4" id="display-ele"></div>

    </div>

    <script>

        let formEle = document.getElementById("form-ele");
        let inputEle = document.getElementById("input-ele");
        let displayEle = document.getElementById("display-ele");
        let totalTasks = document.getElementById("total");

        let taskLists = [
            {
                id: 101,
                task: "Practice JavaScript",
                isCompleted: false,
                createdOn: new Date().toLocaleString()
            },
            {
                id: 102,
                task: "Practice HTML",
                isCompleted: false,
                createdOn: new Date().toLocaleString()
            },
            {
                id: 103,
                task: "Practice For Mock",
                isCompleted: false,
                createdOn: new Date().toLocaleString()
            }
        ];

        // Display Tasks
        function displayData(tasks) {

            let htmlCode = ``;

            totalTasks.innerHTML =
                `<p> Total Tasks: ${taskLists.length}</p>`;

            if (tasks.length > 0) {

                tasks.forEach((task) => {

                    htmlCode += `
                        <div class="col-lg-4 col-md-6 col-12 mt-3 mb-3">
                            <div class="card h-100">
                                <div class="card-body">

                                    <input
                                        type="checkbox"
                                        onchange="handleToggle(${task.id})"
                                        ${task.isCompleted ? 'checked' : ''}
                                    >

                                    <span class="task-title">
                                        ${task.task}
                                    </span>

                                    <br>

                                    <p class="${task.isCompleted
                                        ? 'status-completed'
                                        : 'status-pending'}">

                                        ${task.isCompleted
                                            ? '✓ Completed'
                                            : ' Not Completed'}

                                    </p>

                                    <p class="date-text">
                                        ${task.createdOn}
                                    </p>

                                    <button
                                        class="delete-btn"
                                        onclick="handleDelete(${task.id})">

                                        🗑 Delete

                                    </button>

                                </div>
                            </div>
                        </div>
                    `;
                });

                displayEle.innerHTML = htmlCode;

            } else {

                displayEle.innerHTML =
                    `<h4 class="empty-message">
                        🎉 No Tasks Available! Please Add a Task.
                    </h4>`;
            }
        }

        // Initial Display
        displayData(taskLists);

        // Add Task
        formEle.addEventListener("submit", function(e) {

            e.preventDefault();

            let inputTask = inputEle.value.trim();

            if (inputTask !== "") {

                let newTask = {
                    id: Date.now(),
                    task: inputTask,
                    isCompleted: false,
                    createdOn: new Date().toLocaleString()
                };

                taskLists.push(newTask);

                handleSelect();

                inputEle.value = "";

            } else {

                alert("Please Enter a Valid Task!");

            }

        });

        // Delete Task
        function handleDelete(id) {

            taskLists = taskLists.filter(
                ele => ele.id !== id
            );

            handleSelect();
        }

        // Toggle Completed Status
        function handleToggle(id) {

            taskLists = taskLists.map(ele => {

                if (ele.id === id) {
                    ele.isCompleted = !ele.isCompleted;
                }

                return ele;

            });

            handleSelect();
        }

        // Filter Tasks
        function handleSelect() {

            let options =
                document.getElementById("select-option").value;

            let filteredTasks = taskLists;

            if (options === "Completed") {

                filteredTasks = taskLists.filter(
                    ele => ele.isCompleted
                );

            } else if (options === "Not Completed") {

                filteredTasks = taskLists.filter(
                    ele => !ele.isCompleted
                );

            }

            displayData(filteredTasks);
        }

    </script>

</body>
</html>

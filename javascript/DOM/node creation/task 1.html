<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Like Dislike Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
    }

    .container {
        width: 350px;
        height: 450px;
        border: 2px solid blue;
        border-radius: 10px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .buttons {
        display: flex;
        justify-content: space-around;
        width: 100%;
        text-align: center;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
        background-color: white;
        border: 2px solid blue;
        border-radius: 5px;
    }
   

    p {
        font-size: 22px;
        font-weight: bold;
    }

    .total {
        text-align: center;
        margin-top: 15px;
       
    }
    #likeBtn {
        background-color: red;
        
    }
    #dislikeBtn {
        background-color: green;
    }
    .tbtn{
        background-color: lightseagreen;
    }
</style>

<body>

    <div class="container">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2017/02/Instagram-Logo.png" alt=""height="100px" width="170px">
        </div>

        <div class="buttons">
            <div>
                <button id="likeBtn">Like</button>
                <p id="likeCount">0</p>
            </div>

            <div>
                <button id="dislikeBtn">Dislike</button>
                <p id="dislikeCount">0</p>
            </div>
        </div>

        <div class="total">
            <button class="tbtn">Total</button>
            <p id="totalCount">0</p>
        </div>

    </div>

    <script>
        let total = 0;
        let like = 0;
        let dislike = 0;

        let likeBtn = document.getElementById("likeBtn");
        let dislikeBtn = document.getElementById("dislikeBtn");

        let likeCount = document.getElementById("likeCount");
        let dislikeCount = document.getElementById("dislikeCount");
        let totalCount = document.getElementById("totalCount");

        // Like button
        likeBtn.addEventListener("click", function () {
            like ++;
            total ++;

            likeCount.textContent = like;
            totalCount.textContent = total;
        });

        // Dislike button
        dislikeBtn.addEventListener("click", function () {
            dislike ++;
            total ++;

            dislikeCount.textContent = dislike;
            totalCount.textContent = total;
        });

        let likes=localStorage.getItem('likeCount') || 0;
        let dislikes=localStorage.getItem('dislikeCount') || 0;
        let totals=localStorage.getItem('totalCount') || 0;

        likeCount.textContent = likes;
        dislikeCount.textContent = dislikes;
        totalCount.textContent = totals;

        likeBtn.addEventListener("click", function () {
            likes++;
            localStorage.setItem('likeCount', likes);
            likeCount.textContent = likes;
            //totalCount.textContent =likes + dislikes;

        });
        localStorage.setItem('totalCount', totals);
        

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // primitive datatypes
        // string --> '', "", ``(backticks)

        let student_name = "john";
        console.log(student_name);

        let institute = 'jspiders';
        console.log(institute);

        let course = `mern stack`;
        console.log(course);

        console.log(` my name is ${student_name} , pursuing ${course} at ${institute} marathahalli`)


        
        //number

        let age =23;
        console.log(age);

        let num = 12.98;
        console.log(num);

        //Boolean

        let isstudent = true;
        console.log(isstudent)

        let ismarried = false;
        console.log(ismarried);


        //null

        let a= null;
        console.log(a);


        //undefined

        let b;
        console.log(b);


        //bigint

        let phno = BigInt( 876543210);
        console.log(phno);


        //symbol

        let s1 = Symbol(100);
        let s2 = Symbol(100);
        console.log(s1 == s2);


        //typeof
        let c = "hello"

        console.log(c,typeof c)

        console.log('5',typeof '5')

       console.log(10,typeof 10)

       console.log(100.5, typeof 100.5)

       console.log(true, typeof true)

       console.log(null, typeof null)

       let d;
       console.log(d, typeof d)

       console.log(54321, typeof 54321)

       console.log(Symbol("hello"), typeof Symbol("hello"))

       console.log(10, typeof typeof 10)

       console.log(10, typeof typeof true)

       console.log(typeof NaN)//number

        




    </script>
</body>

</html>

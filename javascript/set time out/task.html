<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>countdown</h3>
    <p id="countdown"></p>

    <script>
        for (let i = 10; i >= 1; i--) {
            setTimeout(() => {
                document.getElementById('countdown').textContent = i;
                if (i === 1) {
                    document.getElementById('countdown').textContent = 'Happy New Year!';
                }
            }, (11 - i) * 1000);
        }
    </script>
</body>
</html>

<body>
    <h1>Arrays</h1>
    <script>
        let arr1 = ['ram',22,null,true]
        console.log(arr1)
        console.log(arr1.length)//4
        console.log(arr1[2])//null
        arr1[1]=23; 
        console.log(arr1) //['ram',23,null,true]
        arr1[6]=10
        console.log(arr1) 
        console.log(arr1.length)
        console.log('_______________________')

        let n1 = [10,20,30,40,50]
        console.log(n1)
        console.log(n1.length) //5
        n1.length =3;
        console.log(n1) 
        // n1.length =5;
        // console.log(n1)
        
        
        console.log('-----------------------------')
        
        let arr2 = new Array()
        console.log(arr2)
        arr2[0]='ram'
        console.log(arr2)//['ram']
        console.log(arr2.length)//1

        console.log('__________________________')

        let x=[10]
        console.log(x)
        console.log(x.length);


        let y=new Array(10);
        console.log(y)
        console.log(y.length)


    </script>
</body>

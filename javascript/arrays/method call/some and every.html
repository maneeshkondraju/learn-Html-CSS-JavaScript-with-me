<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let data = [20,3,44,65,2,72];
        console.log("---------some()----------")
        console.log(data.some(ele=>ele<2))
        console.log(data.some(ele=>ele>20))
        console.log("---------every()----------")
        console.log(data.every(ele=>ele>0));
        console.log(data.every(ele=>ele>5));

    </script>
</body>
</html>

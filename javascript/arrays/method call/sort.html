<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let data=['ram','shyam','sita','gita','hari','krishna'];
        data.sort();
        console.log(data);

        
        let data2=['ram','shyam','sita','gita','hari','krishna'];
        data2.reverse();
        console.log(data2);

        let num=[10,30,101,40,200,90,50];
        num.sort((a,b)=>a-b);
        console.log(num);

        let num2=[10,30,101,40,200,90,50];
        num2.sort((a,b)=>b-a);
        console.log(num2);
        
    </script>
</body>
</html>

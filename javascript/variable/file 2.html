        // let(es6)

        let phno; // declaration
        console.log(phno)

        phno = 1987654321; //initialization

        phno = 1234567890; //re-initialization
        console.log(phno);

        console.log("end...!")

        let age = 23; //declaration & initialization
        console.log(age);
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //var keyword
        var first_name; //declaration
        console.log(first_name)//undefined
        first_name = "pratyush"; //initialization
        console.log(first_name) //pratyush
        var last_name = "reddy"; //re-declaration & initialization
        console.log(last_name)

        console.log("my name is " + first_name +" " + last_name)
        first_name = "maneesh"; // re-initialization
        console.log(first_name)
    </script>
</body>
</html>

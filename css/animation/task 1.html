<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div-1{
            height: 100px;
            width: 100px;
            background-color: orange;
            margin: 70px;
          
        }
        .div-2{
            height: 100px;
            width: 230px;
            background-color: orange;
            margin: 70px;
        }
        .div-3{
             height: 100px;
            width: 100px;
            background-color: orange;
            margin: 70px;
            border-top-left-radius: 50px;
            border-top-right-radius: 100px;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 50px;
        }
        .div-4{
             height: 100px;
            width: 230px;
            background-color: orange;
            margin: 70px;
             border-top-left-radius: 80px;
            border-top-right-radius: 80px;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 90px;
        }
          .div-5{
            height: 100px;
            width: 100px;
            background-color: orange;
            margin: 70px;
          
        }
         @keyframes animation {
            0%{
                transform: rotate(0deg);
                height: 100px;
            width: 100px;
            background-color: orange;
            margin: 70px;
            }
            25%{
                transform: rotate(180deg);
                 height: 100px;
            width: 230px;
            background-color: orange;
            margin: 70px;
            }
            50%{
                transform: rotate(360deg);
                 height: 100px;
            width: 100px;
            background-color: orange;
            margin: 70px;
            border-top-left-radius: 50px;
            border-top-right-radius: 100px;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 50px;
            }
            75%{
                transform: rotate(180deg);
                 height: 100px;
            width: 230px;
            background-color: orange;
            margin: 70px;
             border-top-left-radius: 80px;
            border-top-right-radius: 80px;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 90px;
            }
            100%{
                transform: rotate(0deg);
                 height: 100px;
            width: 100px;
            background-color: orange;
            margin: 70px;
            }
    </style>
</head>
<body>
    <div class="div-1"></div>
    <div class="div-2"></div>
    <div class="div-3"></div>
    <div class="div-4"></div>
    <div class="div-5"></div>
</body>
</html>

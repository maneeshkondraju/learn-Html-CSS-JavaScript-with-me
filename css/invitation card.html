<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Invitation Card */

        .a {

            width: 450px;
            height: 600px;
            background-image: url("https://blog.1invites.com/wp-content/uploads/2024/09/elegant-blank-wedding-card-template.jpg");
            background-size: cover;
            background-repeat: no-repeat;

            text-align: center;
            /* margin: 100px auto; */

            color: #5a4632;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;

        }

        /* Text Area */

   

        .c {
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;

            margin-bottom: 15px;
            color: black;
            text-align: center;

            font-family: calligraphy;
            padding-top: 120px;
        }

        h1 {
            font-size: 32px;
            font-family: "Brush Script MT", cursive;

            color: black;

            margin-bottom: 8px;
            text-align: center;

        }

        .d {
            font-size: 22px;
            font-style: italic;

            color: #b08a3c;

            margin: 5px 0;
            font-family: geneva;
            text-align: center;

        }

        .e {
            font-size: 28px;

            color: white;

            font-family: Georgia, serif;

            letter-spacing: 1px;

            margin-bottom: 15px;
            border-style: none;
            text-align: center;


        }

        .e:focus {
            background-color: hotpink;
        }


        .g {
            font-size: 14px;
            line-height: 1.6;

            color: #6b5a49;

            margin-bottom: 15px;
            font-family: papyrus, cursive;
            text-align: center;

        }



        .i {
            font-size: 13px;

            line-height: 1.5;

            color: #665344;

            margin-top: 8px;
            text-align: center;

        }

        .f {
            width: 100px;

            border-top: 1px solid #c9a24a;

            margin: 8px auto;
            text-align: center;

        }

        .j {
            font-size: 13px;

            font-style: italic;

            color: black;

            margin-top: 10px;
            font-family: brush script mt, cursive;
            text-align: center;

        }
    </style>
</head>

<body>
    <div class="a">


            <p class="c">
                Together with their <br> families
            </p>

            <h1>
                Wedding Invitation
            </h1>

            <p class="d">
                We invite you to share in the <br> joy of our special day.
            </p>


            <input type="text" class="e" value=" Maneesh & Swetha" readonly>

            <div class="f"></div>

            <p class="g">
                <b> With joyful hearts, we invite you <br>
                    to join us as we begin our <br>
                    beautiful journey together.</b>
            </p>



            <p class="i">

                Grand Wedding Hall<br>
                Nellore, Andhra Pradesh
            </p>

            <p class="j">
                Your presence will make our day special.
            </p>


    </div>
</body>

</html>

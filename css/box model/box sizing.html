<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .content-box{
            height: 300px;
            width: 300px;
            padding: 20px;
            border: 10px solid black;
            background-color: blueviolet;
            font-size: 50px;
            color: white;
            box-sizing: content-box;
        }
        .border-box{
            height: 300px;
            width: 300px;
            padding: 20px;
            border: 10px solid black;
            background-color: blue;
            font-size: 50px;
            color: white;
            box-sizing:border-box;
        }
    </style>
</head>
<body>
   <div class="content-box"> content box</div> <br><br>
   <div class="border-box"> border box</div> 
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100px;
            width: 500px;
        }
        *{
            margin: 0;
            padding: 0;
        }
        section{
            background-color: black;
            height: 100vh;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            flex-wrap: wrap-reverse;
           
            justify-content: space-evenly;

        }
        .div-1{
            background-color: brown;
        }
         .div-2{
            background-color: chartreuse;
        }
         .div-3{
            background-color: blue;
        }
         .div-4{
            background-color: cadetblue;
        }
         .div-5{
            background-color: aqua;
        }
         .div-6{
            background-color: blueviolet;
        }
        .div-7{
            background-color: bisque;
        }
        .div-8{
            background-color: chocolate;
        }
    </style>
</head>
<body>
    <section>
        <div class="div-1"></div>
        <div class="div-2"></div>
        <div class="div-3"></div>
        <div class="div-4"></div>
        <div class="div-5"></div>
        <div class="div-6"></div>
        <div class="div-7"></div>
        <div class="div-8"></div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        /* Red Circle */
        .outer {
            width: 600px;
            height: 600px;
            background: red;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Blue Circle */
        .blue {
            width: 500px;
            height: 500px;
            background: deepskyblue;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Green Circle */
        .green {
            width: 400px;
            height: 400px;
            background: green;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Yellow Circle */
        .yellow {
            width: 300px;
            height: 300px;
            background: gold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orange {
            width: 200px;
            height: 200px;
            background: orange;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .black {
            width: 100px;
            height: 100px;
            background: black;
            border-radius: 50%;
        }

        .arrow {
            position: absolute;
            /* left: 280px;
            top: 420px; */
            width: 480px;
            height: 60px;
            background: blue;
            transform-origin: right center;
            border-top-left-radius: -10px;
             transform: translateX(100px);
        }

        /* .arrow:hover {
            transform: rotate(-20deg);
        } */
    </style>
</head>

<body>
    <div class="outer">
        <div class="blue">
            <div class="green">
                <div class="yellow">
                    <div class="orange">
                        <div class="black"></div>
                    </div>
                </div>

            </div>
        </div>
        <div class="arrow">
            <div class="shaft"></div>
        </div>
    </div>
</body>

</html>

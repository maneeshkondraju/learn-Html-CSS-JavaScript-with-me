<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>A Truly Great Teacher</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #f4f1ec;
  font-family: "Segoe UI", Arial, sans-serif;
  padding: 40px 20px;
}

.photo-frame {
  position: relative;
  width: 420px;
  padding: 18px 18px 60px 18px;
  background-color: #efece6;
  border: 1px solid #ddd8cd;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}

.card {
  position: relative;
  width: 100%;
  height: 520px;
  background-color: #fffdf9;
  background-image: radial-gradient(circle at top left, #fffdf6, #fdf9f0);
  border: 1px solid #e4ded0;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#wreath {
  position: relative;
  width: 330px;
  height: 330px;
  border: 3px solid transparent;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.flower {
  position: absolute;
  font-size: 30px;
  line-height: 1;
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.15));
}

.f1 {
  top: -18px;
  left: 40px;
}
.f2 {
  top: -10px;
  left: 90px;
  font-size: 26px;
}
.f3 {
  top: -22px;
  left: 140px;
}
.f4 {
  top: -18px;
  left: 190px;
  font-size: 26px;
}
.f5 {
  top: -6px;
  left: 235px;
}
.f6 {
  top: 30px;
  left: 275px;
  font-size: 26px;
}
.f7 {
  top: 90px;
  left: 300px;
}
.f8 {
  top: 150px;
  left: 295px;
  font-size: 26px;
}
.f9 {
  top: 210px;
  left: 275px;
}
.f10 {
  top: 260px;
  left: 235px;
  font-size: 26px;
}
.f11 {
  top: 285px;
  left: 175px;
}
.f12 {
  top: 290px;
  left: 110px;
  font-size: 26px;
}
.f13 {
  top: 265px;
  left: 55px;
}
.f14 {
  top: 220px;
  left: 15px;
  font-size: 26px;
}
.f15 {
  top: 155px;
  left: -5px;
}
.f16 {
  top: 95px;
  left: -5px;
  font-size: 26px;
}
.f17 {
  top: 45px;
  left: 5px;
}
.f18 {
  top: -2px;
  left: 10px;
  font-size: 22px;
}

#wreath .quote {
  width: 250px;
  text-align: center;
  color: #2b2b2b;
  font-family: "Brush Script MT", "Segoe Script", cursive;
  letter-spacing: 0.5px;
  line-height: 1.5;
}

#wreath .quote .line1 {
  font-size: 26px;
  font-style: italic;
}

#wreath .quote .line2 {
  font-size: 22px;
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 6px;
  font-weight: bold;
}

#wreath .quote .line3 {
  font-size: 20px;
  font-family: Georgia, serif;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 4px;
}

#wreath .quote .line4 {
  font-size: 24px;
  font-family: "Brush Script MT", "Segoe Script", cursive;
  font-style: italic;
  margin-top: 6px;
}

.corner-flower {
  position: absolute;
  bottom: -35px;
  font-size: 130px;
  line-height: 1;
  z-index: 5;
  filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.25));
}

.purple {
  left: -55px;
  color: #8e2f8e;
}

.yellow {
  right: -45px;
  font-size: 150px;
  color: #f4c400;
}

.photo-frame:hover {
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
  transition: box-shadow 0.3s ease;
}
  </style>
  <body>
    <div class="photo-frame">
      <div class="card">
        <div id="wreath">
          <span class="flower f1">🌸</span>
          <span class="flower f2">🌿</span>
          <span class="flower f3">🌺</span>
          <span class="flower f4">🌿</span>
          <span class="flower f5">🌸</span>
          <span class="flower f6">🌿</span>
          <span class="flower f7">🌺</span>
          <span class="flower f8">🌿</span>
          <span class="flower f9">🌸</span>
          <span class="flower f10">🌿</span>
          <span class="flower f11">🌺</span>
          <span class="flower f12">🌿</span>
          <span class="flower f13">🌸</span>
          <span class="flower f14">🌿</span>
          <span class="flower f15">🌺</span>
          <span class="flower f16">🌿</span>
          <span class="flower f17">🌸</span>
          <span class="flower f18">🌿</span>

          <div class="quote">
            <div class="line1">A truly great</div>
            <div class="line1">teacher is</div>
            <div class="line2">Hard to Find</div>
            <div class="line3">Difficult to part</div>
            <div class="line3">with &amp; Impossible</div>
            <div class="line4">to forget.</div>
          </div>
        </div>
      </div>

      <span class="corner-flower purple">✿</span>
      <span class="corner-flower yellow">❀</span>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: cursive;

        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            font-family: cursive;
        }

        .login-box {
            width: 300px;
            background-color: white;
            border-radius: 15px ;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);
        }

        .login-title {
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: bold;

            background-color: #BB4392;
        }

        .login-form {
            padding: 25px;
        }

        .login-form input {
            width: 100%;
            height: 38px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 12px;
        }

        .login-form input:focus {
            border-color: #00bfff;
        }

        .login-btn {
            width: 100%;
            height: 38px;
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;

            background-color: #BB4392;
            
        }

        .signup {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            color: #555;
        }

        .signup a {
            color: #007bff;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="login-title">
            Login Form
        </div>

        <div class="login-form">

            <input type="email" placeholder="Email Address">

            <input type="password" placeholder="Password">

            <button class="login-btn">
                Login
            </button>

            <div class="signup">
                Not a member?
                <a href="#">Signup now</a>
            </div>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height:70px;
            width: 40px;
        }
        .div-1{
            background-color: orange;
            position: absolute;
            z-index: -10;
        }
        .div-2{
            background-color: rgb(225, 222, 222);
            position: absolute;
            z-index: -9;
            left: 40px;
        }
        .div-3{
            background-color: green;
            position: absolute;
            z-index: 5;
            left: 80px;
        }
    </style>
</head>
<body>
    <div></div>
    <div class="div-1"></div>
    <div class="div-2"></div>
    <div class="div-3"></div>
</body>
</html>
